user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Never advertise the nginx version in error pages / Server headers.
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 100M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

  # ── Edge request throttling (GAP-04 / FIX-17) ──────────────────────
  # Shared zones keyed by the real client IP ($binary_remote_addr — the
  # edge always sees the true client because it rewrites X-Forwarded-For
  # itself, never trusting client-supplied headers; see FIX-07).
  # These are COARSE flood gates. The backend enforces its own stricter
  # per-IP / per-email budgets (throttle:public / auth / contact / admin
  # plus action-level checks), so the edge can stay generous and never
  # hurts legitimate traffic. Zones must live in the http context.
  limit_req_zone $binary_remote_addr zone=public:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # NOTE: nginx cannot express requests-per-hour (rate supports only r/s
  # and r/m), so the contact zone runs at 3r/m as a coarse flood gate;
  # the real 3-per-hour (per IP) and 2-per-hour (per email) budgets are
  # enforced by the backend (throttle:contact + action-level checks).
  limit_req_zone $binary_remote_addr zone=contact:10m rate=3r/m;

  # Connection-level DoS cap — 20 concurrent connections per client IP
  # (generous for a real browser, still bounds connection floods).
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # Throttled requests are a client error, not a server problem.
  limit_req_status 429;
  limit_conn_status 429;

  # The external TLS gateway announces the client's scheme via
  # X-Forwarded-Proto; pass it through to the upstreams so the backend's
  # TLS gate (RequireTlsInProduction) still sees https. When the header is
  # absent (a client reached this edge directly over plain HTTP), fall
  # back to this edge's own scheme so the gate fails loud as designed.
  map $http_x_forwarded_proto $x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  include /etc/nginx/conf.d/*.conf;
}
