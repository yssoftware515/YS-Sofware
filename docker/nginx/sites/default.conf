upstream frontend {
  server frontend:3000;
}

upstream backend {
  server backend:8000;
}

server {
  listen 80;
  server_name _;

  # Security headers. HSTS is omitted deliberately: this edge serves plain
  # HTTP only (no TLS vhost exists; TLS terminates on an external gateway
  # in front of this nginx), and an HSTS header emitted over HTTP is both
  # ignored by browsers and misleading.
  #
  # Note on CSP: deliberately NOT set here — the upstreams already emit
  # their own Content-Security-Policy (backend SecurityHeaders middleware,
  # frontend next.config headers). An edge-level CSP would stack with the
  # upstream one and effectively AND both policies together, which can
  # break pages without adding security.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # X-XSS-Protection is deprecated and, in mode=block, can itself be used
  # to force-refresh a page; modern CSP makes it obsolete. Explicity "0".
  add_header X-XSS-Protection "0" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  # Connection-level DoS cap (GAP-04 / FIX-17): 20 concurrent
  # connections per client IP across all locations (zone in nginx.conf).
  limit_conn conn_limit 20;

  # Frontend
  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    proxy_cache_bypass $http_upgrade;
  }

  # ── API edge throttling (GAP-04 / FIX-17) ─────────────────────────
  # Regex locations are evaluated in file order and take precedence over
  # the prefix locations below. Each family gets its own zone (defined in
  # nginx.conf) with a nodelay burst: allowed requests pass instantly,
  # everything beyond the burst is rejected 429.

  # Auth — brute-force surface (login / forgot-password / reset-password
  # / logout / me / change-password): 10 req/min per IP + 5 burst.
  # The backend adds per-IP 5/min (throttle:auth) and the escalating
  # per-email lockout (VULN-15) on top.
  location ~ ^/api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
  }

  # Contact form — strictest gate (3r/m edge + 2 burst; see the NOTE in
  # nginx.conf about r/h granularity). The true 3/h per IP and 2/h per
  # email budgets are enforced by the backend.
  location ~ ^/api/v1/public/contact$ {
    limit_req zone=contact burst=2 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
  }

  # Public read API — 120 req/min per IP + 20 burst (mirrors the app's
  # throttle:public budget).
  location ~ ^/api/v1/public/ {
    limit_req zone=public burst=20 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
  }

  # API — everything else (admin + health): the admin family is
  # throttled per-user at the application layer (300/min, VULN-27);
  # health stays unthrottled for probes.
  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
  }

  # Backend storage (uploads) — /storage/<path> -> backend /storage/<path>
  location /storage/ {
    proxy_pass http://backend/storage/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Laravel Sanctum CSRF handshake (G-01): the SPA flow primes the
  # XSRF-TOKEN cookie via GET /sanctum/csrf-cookie. The endpoint lives at
  # the ORIGIN ROOT — NOT under /api/v1 — so it must be routed to the
  # backend explicitly; without this location it would hit the Next.js
  # frontend and 404, breaking every browser login.
  location /sanctum/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
  }
}