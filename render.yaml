# Render Blueprint — ys-api (Laravel 12 / PHP 8.4)
# Docker-based Web Service. Build and start commands live in the
# Dockerfile and entrypoint.sh; this file declares the service
# topology and environment variables for Render's dashboard.
#
# First-deployment initialization (seeders) must be run manually
# via Render Shell: php artisan db:seed --force
# Migrations run automatically at every startup (idempotent).

services:
  - type: web
    name: ys-api
    runtime: docker
    dockerfilePath: ys-api/Dockerfile
    dockerContext: ys-api
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # ── Application ──────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://ys-api.onrender.com
      - key: FRONTEND_URL
        value: https://ys-sofware.vercel.app

      # ── Database (Neon PostgreSQL) ───────────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # ── Cache (database driver) ──────────────────────────────
      - key: CACHE_STORE
        value: database

      # ── Session (database driver) ────────────────────────────
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_DOMAIN
        value: ""

      # ── Queue (database, no worker on free tier) ─────────────
      - key: QUEUE_CONNECTION
        value: database

      # ── Logging ──────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr

      # ── Mail (log driver, free tier) ─────────────────────────
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@ys-systems.com
      - key: MAIL_ADMIN_ADDRESS
        sync: false

      # ── Security ─────────────────────────────────────────────
      - key: REQUIRE_TLS
        value: "true"
      - key: TRUSTED_PROXIES
        value: "private_ranges"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: localhost,localhost:3000,127.0.0.1,127.0.0.1:8000,::1,ys-sofware.vercel.app
      - key: AUTH_COOKIE_PARTITIONED
        value: "true"

      # ── Filesystem (local for initial launch) ────────────────
      - key: FILESYSTEM_DISK
        value: local

      # ── Admin credentials ────────────────────────────────────
      - key: ADMIN_PASSWORD
        sync: false
