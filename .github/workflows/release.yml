name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.4.0)'
        required: true
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ${{ github.repository }}/frontend
  BACKEND_IMAGE: ${{ github.repository }}/backend

jobs:
  # ─────────────────────────────────────────────
  # 1. BUILD & PUBLISH DOCKER IMAGES
  # ─────────────────────────────────────────────
  docker-build:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ys-web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://ys-systems.com' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ys-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 2. DEPLOY TO ENVIRONMENT
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [docker-build]
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # G-09: known_hosts is pinned (fail-closed). StrictHostKeyChecking
          # stays at its default (ask) - with a matching known_hosts entry the
          # connection proceeds; an unknown/changed host key aborts the deploy
          # instead of silently accepting a MITM.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /opt/ys-platform
            # Scoped prune ONLY: `docker system prune -f` removes every
            # stopped container and unused image on the host — including
            # other projects' containers and the previous release's tagged
            # images (the rollback target). Tagged images are exempt from
            # `docker image prune`, so the previous release stays pullable.
            docker compose pull
            # CR-02: run migrations BEFORE switching traffic to the new image.
            docker compose run --rm backend php artisan migrate --force
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Verify deployment
        run: |
          sleep 15
          # DEPLOY_URL is the public HTTPS host (scheme omitted, e.g.
          # ys-systems.com) - the ingress terminates TLS and forwards
          # X-Forwarded-Proto, which the backend's RequireTlsInProduction
          # gate requires (G-02).
          # Frontend must respond through the ingress (nginx location / -> frontend:3000).
          curl -f --retry 10 --retry-delay 5 --retry-all-errors https://${{ secrets.DEPLOY_URL }}/health/live || exit 1
          # Backend must respond through the ingress (nginx /api/ -> backend:8000,
          # path preserved; route is open, no auth). This is the real readiness gate.
          curl -f --retry 10 --retry-delay 5 --retry-all-errors https://${{ secrets.DEPLOY_URL }}/api/v1/health || exit 1
          # G-02 TLS gate: a plain-HTTP request must be refused by the
          # backend (403 when RequireTlsInProduction rejects, 301/308 when
          # an ingress-level redirect fires first) - it must NEVER reach
          # the auth layer.
          status=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.DEPLOY_URL }}/api/v1/admin/products)
          case "$status" in 403|301|308) ;; *) echo "expected 403/301/308 over plain HTTP, got $status"; exit 1;; esac
          # Auth layer reachable over HTTPS: unauthenticated request must
          # be rejected (401/419), not 502/404/200.
          status=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DEPLOY_URL }}/api/v1/admin/products)
          if [ "$status" != "401" ] && [ "$status" != "419" ]; then echo "expected 401/419 over HTTPS, got $status"; exit 1; fi

  # ─────────────────────────────────────────────
  # 3. ROLLBACK VALIDATION
  # ─────────────────────────────────────────────
  rollback-ready:
    name: Rollback Validation
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Mark rollback required
        run: |
          echo "::warning::Deployment failed. Rollback to previous version required."
          echo "Run: docker compose pull <previous-tag> && docker compose up -d"
