worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 100M;
  server_tokens off;

  # Backend HTTP layer: terminates HTTP on :8000 and speaks FastCGI to
  # php-fpm on :9000. This is what docker-compose healthcheck, the edge
  # nginx upstream (backend:8000) and local dev (localhost:8000) all hit.
  server {
    listen 8000;
    server_name _;

    root /app/public;
    index index.php;

    # Security headers are set exclusively by Laravel's SecurityHeaders
    # middleware (bootstrap/app.php). Do NOT add add_header directives
    # here — duplicates cause double-headers, and X-XSS-Protection in
    # particular must stay at "0" (CSP replaces it).

    # Laravel front controller — full URI (including /api/v1/...) is
    # preserved; nothing is stripped here.
    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check — served directly by nginx, never reaches Laravel.
    # Railway probes GET /up inside the container over plain HTTP. If
    # the request reaches Laravel, RequireTlsInProduction rejects it
    # with 403 because $request->secure() is false (no TLS inside the
    # container, and TRUSTED_PROXIES may not be configured). Serving
    # it here avoids that entirely.
    location = /up {
      access_log off;
      return 200 'OK';
      add_header Content-Type text/plain;
    }

    # User uploads via the public/storage symlink -> /app/storage/app/public
    location ^~ /storage/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
      try_files $uri =404;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
  }
}
