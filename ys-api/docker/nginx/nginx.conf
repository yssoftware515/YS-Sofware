worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  # Edge vhosts (docker/nginx/sites/*.conf) — see the `nginx` service in
  # docker-compose.yml, which bind-mounts that directory here.
  include /etc/nginx/conf.d/*.conf;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 100M;

  # Backend HTTP layer: terminates HTTP on :8000 and speaks FastCGI to
  # php-fpm on :9000. This is what docker-compose healthcheck, the edge
  # nginx upstream (backend:8000) and local dev (localhost:8000) all hit.
  server {
    listen 8000;
    server_name _;

    root /app/public;
    index index.php;

    # Laravel front controller — full URI (including /api/v1/...) is
    # preserved; nothing is stripped here.
    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    # User uploads via the public/storage symlink -> /app/storage/app/public
    location ^~ /storage/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
      try_files $uri =404;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
  }
}
