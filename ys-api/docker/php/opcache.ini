; Production OPcache tuning (Phase 4A, P2-07).
;
; The application code is baked into an immutable image (no volume-mounted
; source), so validate_timestamps is off: opcache never re-stats files.
; If you ever mount live code into this image, set validate_timestamps=1.
;
; Deliberately NO JIT: JIT only pays off for long-running numeric loops,
; which this workload does not have — it would add startup cost for nothing.
;
; CLI (artisan queue:work / schedule:work) is NOT affected: opcache.enable_cli
; stays at its default 0, so workers always see fresh code after a deploy.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.fast_shutdown=1