  <path d="M 155,121 L 124,152 L 90,194 L 65,234 L 49,266 L 31,314 L 19,359 L 10,408 L 4,470 L 4,1281 L 8,1337 L 16,1394 L 24,1432 L 36,1474 L 50,1512 L 70,1554 L 78,1567 L 99,1596 L 124,1626 L 163,1665 L 196,1690 L 245,1720 L 273,1734 L 304,1747 L 346,1759 L 404,1770 L 454,1776 L 513,1779 L 1280,1779 L 1357,1774 L 1405,1768 L 1454,1759 L 1493,1749 L 1523,1739 L 1564,1719 L 1593,1702 L 1628,1677 L 1649,1659 L 1680,1628 L 1712,1588 L 1735,1551 L 1755,1510 L 1775,1449 L 1787,1394 L 1795,1332 L 1797,1279 L 1797,475 L 1794,436 L 1790,404 L 1781,357 L 1767,305 L 1754,269 L 1741,242 L 1715,200 L 1693,171 L 1672,147 L 1639,115 L 1594,80 L 1570,65 L 1526,45 L 1471,27 L 1413,14 L 1359,6 L 1305,2 L 484,2 L 441,5 L 409,9 L 357,19 L 319,29 L 261,50 L 234,63 L 211,77 L 182,98 Z" fill="none" stroke="url(#edgeGrad)" stroke-width="3.2" opacity="0.95"/>

