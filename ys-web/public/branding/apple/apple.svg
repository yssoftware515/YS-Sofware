  <path d="M 799,723 L 675,841 L 674,938 L 990,1248 L 910,1322 L 812,1227 L 812,1093 L 799,1079 L 675,1193 L 675,1284 L 911,1507 L 1142,1289 L 1142,1197 L 813,880 L 812,733 Z" fill="#FFFFFF"/>
